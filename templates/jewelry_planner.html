<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jewelry Planner | PocketSmart AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}">

    <style>
        .planner-page {
            min-height: 100vh;
            padding: 100px 20px 70px;
        }

        .section-label {
            display: inline-block;
            padding: 8px 18px;
            border-radius: 25px;
            background: rgba(210, 160, 255, 0.25);
            color: #e2baff;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .planner-page h1 {
            color: white;
            font-weight: 800;
        }

        .planner-page > .container > .text-center p {
            color: #d8d0ed;
        }

        .form-card {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 28px;
            padding: 42px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.25);
        }

        .form-label {
            color: #49335f;
            font-weight: 700;
        }

        .form-control,
        .form-select {
            border-radius: 12px;
            padding: 13px;
            border: 1px solid #d8c9e8;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #9c63d2;
            box-shadow: 0 0 0 0.2rem rgba(156, 99, 210, 0.18);
        }

        .upload-box {
            background: #f7f0fc;
            border: 2px dashed #c5a1e5;
            border-radius: 18px;
            padding: 22px;
        }

        .upload-box small {
            color: #766783 !important;
        }

        #imagePreview {
            display: none;
            max-width: 100%;
            max-height: 250px;
            margin: 20px auto 0;
            border-radius: 16px;
            object-fit: contain;
            box-shadow: 0 8px 20px rgba(80, 40, 120, 0.18);
        }

        .btn-primary {
            border-radius: 30px;
            font-weight: 700;
        }

        @media (max-width: 576px) {
            .form-card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg navbar-dark px-4 py-3">

        <div class="container">

            <a class="navbar-brand fw-bold" href="/">
                PocketSmart <span>AI</span>
            </a>

            <a href="/" class="btn btn-outline-light">
                ← Back to Home
            </a>

        </div>

    </nav>


    <!-- JEWELRY PLANNER -->

    <section class="planner-page">

        <div class="container">

            <div class="text-center mb-5">

                <span class="section-label">
                    SMART JEWELRY PLANNER
                </span>

                <h1 class="display-5 fw-bold mt-3">
                    Find Your Perfect Match
                </h1>

                <p class="mt-3">
                    Choose your occasion and style to plan
                    your jewelry budget.
                </p>

            </div>


            <div class="row justify-content-center">

                <div class="col-lg-9 col-xl-8">

                    <div class="form-card">

                        <form
                            action="/generate-jewelry"
                            method="post"
                            enctype="multipart/form-data"
                        >

                            <!-- BUDGET -->

                            <div class="mb-4">

                                <label class="form-label">
                                    Jewelry Budget (₹)
                                </label>

                                <input
                                    type="number"
                                    name="budget"
                                    class="form-control form-control-lg"
                                    placeholder="Enter your jewelry budget"
                                    min="1"
                                    required
                                >

                            </div>


                            <!-- OCCASION -->

                            <div class="mb-4">

                                <label class="form-label">
                                    Occasion
                                </label>

                                <select
                                    name="occasion"
                                    class="form-select form-select-lg"
                                    required
                                >

                                    <option value="">
                                        Choose an occasion
                                    </option>

                                    <option value="Wedding">
                                        Wedding
                                    </option>

                                    <option value="Birthday">
                                        Birthday
                                    </option>

                                    <option value="Party">
                                        Party
                                    </option>

                                    <option value="Traditional Function">
                                        Traditional Function
                                    </option>

                                    <option value="Daily Wear">
                                        Daily Wear
                                    </option>

                                </select>

                            </div>


                            <!-- STYLE -->

                            <div class="mb-4">

                                <label class="form-label">
                                    Jewelry Style
                                </label>

                                <select
                                    name="style"
                                    class="form-select form-select-lg"
                                    required
                                >

                                    <option value="">
                                        Choose your style
                                    </option>

                                    <option value="Traditional">
                                        Traditional
                                    </option>

                                    <option value="Modern">
                                        Modern
                                    </option>

                                    <option value="Elegant">
                                        Elegant
                                    </option>

                                    <option value="Minimal">
                                        Minimal
                                    </option>

                                    <option value="Statement">
                                        Statement
                                    </option>

                                </select>

                            </div>


                            <!-- OUTFIT IMAGE -->

                            <div class="mb-4">

                                <label class="form-label">
                                    Upload Outfit Image (Optional)
                                </label>

                                <div class="upload-box">

                                    <input
                                        type="file"
                                        name="outfit_image"
                                        id="outfitImage"
                                        class="form-control form-control-lg"
                                        accept="image/*"
                                    >

                                    <small class="d-block mt-2">
                                        Upload an outfit image to help match
                                        jewelry with your style.
                                    </small>

                                    <img
                                        id="imagePreview"
                                        alt="Outfit preview"
                                    >

                                </div>

                            </div>


                            <!-- SUBMIT BUTTON -->

                            <button
                                type="submit"
                                class="btn btn-primary btn-lg w-100 mt-4"
                            >

                                Generate My Jewelry Plan →

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- IMAGE PREVIEW SCRIPT -->

    <script>

        const outfitImage = document.getElementById("outfitImage");
        const imagePreview = document.getElementById("imagePreview");

        outfitImage.addEventListener("change", function () {

            const file = this.files[0];

            if (file) {

                const reader = new FileReader();

                reader.onload = function (event) {

                    imagePreview.src = event.target.result;
                    imagePreview.style.display = "block";

                };

                reader.readAsDataURL(file);

            } else {

                imagePreview.style.display = "none";
                imagePreview.src = "";

            }

        });

    </script>

    <script src="{{ url_for('static', path='script.js') }}"></script>

</body>

</html>
