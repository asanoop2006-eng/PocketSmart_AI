<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - PocketSmart AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', path='style.css') }}">

    <style>
        .register-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .register-card {
            max-width: 600px;
            width: 100%;
            padding: 45px 55px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 15px 45px rgba(100, 70, 140, 0.20);
        }

        .brand-name {
            color: #7652a8;
            font-size: 30px;
            font-weight: 700;
        }

        .brand-name span {
            color: #b08bd4;
        }

        .register-title {
            color: #4b3567;
            font-weight: 700;
        }

        .register-subtitle {
            color: #777080;
        }

        .form-label {
            color: #51425f;
            font-weight: 600;
        }

        .form-control {
            border: 1px solid #d9c9eb;
            border-radius: 12px;
            padding: 12px;
        }

        .form-control:focus {
            border-color: #a78bca;
            box-shadow: 0 0 0 0.2rem rgba(167, 139, 202, 0.20);
        }

        .register-button {
            background: linear-gradient(135deg, #9672c5, #b89bd8);
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            color: white;
        }

        .register-button:hover {
            background: linear-gradient(135deg, #805baa, #a585c9);
            color: white;
        }

        .login-link,
        .back-link {
            color: #805baa;
            font-weight: 600;
            text-decoration: none;
        }

        .login-link:hover,
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="register-page">

        <div class="register-card">

            <div class="text-center mb-4">

                <div class="brand-name">
                    PocketSmart <span>AI</span>
                </div>

                <h2 class="register-title mt-4">
                    Create Your Account 💜
                </h2>

                <p class="register-subtitle">
                    Join PocketSmart AI and start planning smarter
                </p>

            </div>

            <form method="post" action="/register">

                <div class="mb-3">

                    <label class="form-label">
                        Full Name
                    </label>

                    <input type="text"
                           name="name"
                           class="form-control"
                           placeholder="Enter your full name"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Email Address
                    </label>

                    <input type="email"
                           name="email"
                           class="form-control"
                           placeholder="Enter your email"
                           required>

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Password
                    </label>

                    <input type="password"
                           name="password"
                           class="form-control"
                           placeholder="Create a password"
                           required>

                </div>

                <button type="submit"
                        class="btn register-button w-100">
                    Create Account ✨
                </button>

            </form>

           <p class="text-center mt-3" style="color: #d8d0ed;">
    Already have an account?
    <a href="/login" style="color: #c77dff; font-weight: 700;">
        Login
    </a>
</p>

            <div class="text-center mt-3">

                <a href="/" class="back-link">
                    ← Back to Homepage
                </a>

            </div>

        </div>

    </div>

</body>

</html>
