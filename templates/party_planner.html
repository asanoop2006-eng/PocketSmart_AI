<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Party Planner | PocketSmart AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}">
</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg navbar-dark px-4 py-3">

        <div class="container">

            <a class="navbar-brand fw-bold" href="/">
                PocketSmart <span>AI</span>
            </a>

            <a href="/" class="btn btn-outline-light">
                ← Back to Home
            </a>

        </div>

    </nav>


    <!-- PARTY PLANNER -->

    <section class="planner-page">

        <div class="container">

            <div class="text-center mb-5">

                <span class="section-label">
                    SMART PARTY PLANNER
                </span>

                <h1 class="display-5 fw-bold mt-3">
                    Plan Your Perfect Event
                </h1>

                <p class="mt-3">
                    Organize your event while staying within your budget.
                </p>

            </div>


            <div class="row justify-content-center">

                <div class="col-lg-9 col-xl-8">

                    <div class="form-card">

                        <form action="/generate-party" method="post">

                            <!-- BUDGET -->

                            <div class="mb-4">

                                <label class="form-label">
                                    Total Budget (₹)
                                </label>

                                <input
                                    type="number"
                                    name="budget"
                                    class="form-control form-control-lg"
                                    placeholder="Enter your event budget"
                                    min="1"
                                    required
                                >

                            </div>


                            <!-- GUESTS -->

                            <div class="mb-4">

                                <label class="form-label">
                                    Number of Guests
                                </label>

                                <input
                                    type="number"
                                    name="guests"
                                    class="form-control form-control-lg"
                                    placeholder="Enter guest count"
                                    min="1"
                                    required
                                >

                            </div>


                            <!-- EVENT TYPE -->

                            <div class="mb-4">

                                <label class="form-label">
                                    Event Type
                                </label>

                                <select
                                    name="event_type"
                                    class="form-select form-select-lg"
                                    required
                                >

                                    <option value="">
                                        Choose your event
                                    </option>

                                    <option value="Birthday">
                                        Birthday
                                    </option>

                                    <option value="Wedding">
                                        Wedding
                                    </option>

                                    <option value="Corporate Event">
                                        Corporate Event
                                    </option>

                                    <option value="Family Function">
                                        Family Function
                                    </option>

                                    <option value="Other">
                                        Other
                                    </option>

                                </select>

                            </div>


                            <!-- VENUE -->

                            <div class="mb-4">

                                <label class="form-label">
                                    Venue Details
                                </label>

                                <input
                                    type="text"
                                    name="venue"
                                    class="form-control form-control-lg"
                                    placeholder="Example: Home, Hall, Outdoor"
                                    required
                                >

                            </div>


                            <!-- SUBMIT BUTTON -->

                            <button
                                type="submit"
                                class="btn btn-primary btn-lg w-100 mt-4"
                            >

                                Generate My Party Plan →

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </section>

</body>
<script src="{{ url_for('static', path='script.js') }}"></script>
</html>
