<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home Interior Planner | PocketSmart AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}">
</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg navbar-dark px-4 py-3">

        <div class="container">

            <a class="navbar-brand fw-bold" href="/">
                PocketSmart <span>AI</span>
            </a>

            <a href="/" class="btn btn-outline-light">
                ← Back to Home
            </a>

        </div>

    </nav>


    <!-- HOME PLANNER -->

    <section class="planner-page">

        <div class="container">

            <div class="text-center mb-5">

                <span class="section-label">
                    SMART HOME PLANNER
                </span>

                <h1 class="display-5 fw-bold mt-3">
                    Design Your Dream Space
                </h1>

                <p class="mt-3">
                    Enter your budget and preferences to create
                    a personalized home plan.
                </p>

            </div>


            <div class="row justify-content-center">

                <div class="col-lg-9 col-xl-8">

                    <div class="form-card">

                        <form action="/generate-home" method="post">

                            <!-- BUDGET -->

                            <div class="mb-4">

                                <label class="form-label">
                                    Your Budget (₹)
                                </label>

                                <input
                                    type="number"
                                    name="budget"
                                    class="form-control form-control-lg"
                                    placeholder="Enter your total budget"
                                    min="1"
                                    required
                                >

                            </div>


                            <!-- ROOM TYPE -->

                            <div class="mb-4">

                                <label class="form-label">
                                    Select Room Type
                                </label>

                                <select
                                    name="room_type"
                                    class="form-select form-select-lg"
                                    required
                                >

                                    <option value="">
                                        Choose a room
                                    </option>

                                    <option value="Living Room">
                                        Living Room
                                    </option>

                                    <option value="Bedroom">
                                        Bedroom
                                    </option>

                                    <option value="Kitchen">
                                        Kitchen
                                    </option>

                                    <option value="Full Home">
                                        Full Home
                                    </option>

                                </select>

                            </div>


                            <!-- QUANTITIES -->

                            <div class="row g-4">

                                <div class="col-md-4">

                                    <label class="form-label">
                                        Number of Lights
                                    </label>

                                    <input
                                        type="number"
                                        name="lights"
                                        class="form-control form-control-lg"
                                        min="0"
                                        value="1"
                                        required
                                    >

                                </div>


                                <div class="col-md-4">

                                    <label class="form-label">
                                        Number of Fans
                                    </label>

                                    <input
                                        type="number"
                                        name="fans"
                                        class="form-control form-control-lg"
                                        min="0"
                                        value="1"
                                        required
                                    >

                                </div>


                                <div class="col-md-4">

                                    <label class="form-label">
                                        Number of Tables
                                    </label>

                                    <input
                                        type="number"
                                        name="tables"
                                        class="form-control form-control-lg"
                                        min="0"
                                        value="1"
                                        required
                                    >

                                </div>

                            </div>


                            <!-- SUBMIT BUTTON -->

                            <button
                                type="submit"
                                class="btn btn-primary btn-lg w-100 mt-5"
                            >

                                Generate My Home Plan →
                                
                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </section>

</body>
<script src="{{ url_for('static', path='script.js') }}"></script>
</html>
